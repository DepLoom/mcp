name: audit-native
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/deploom_mcp/**'
      - 'tests/test_*audit*.py'
      - 'scripts/smoke_audit_wheel.py'
      - 'build_support.py'
      - 'pyproject.toml'
      - 'release-manifest.json'
      - 'upstream/deploom'
      - '.github/workflows/audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: native-audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Provision trusted test CLI (not project dependencies)
        run: npm install --prefix "${{ runner.temp }}/audit-yarn-cli" --ignore-scripts --no-audit --no-fund @yarnpkg/cli-dist@4.9.2
      - name: Add prepared Yarn binary to PATH
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as stream:
              stream.write(str(Path(os.environ['RUNNER_TEMP']) / 'audit-yarn-cli' / 'node_modules' / '.bin') + '\n')
      - name: Build isolated package
        run: |
          python -m pip install build
          python -m build
      - name: Installed wheel, real npm/Yarn, localhost audit evidence, real MCP stdio
        run: python scripts/smoke_audit_wheel.py
