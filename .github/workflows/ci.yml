name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (runtime deps incl. jsonschema)
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Full test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Versioned Skill and release resources
        run: |
          python scripts/check_skill.py
          python scripts/update_release_manifest.py --check
      - name: stdio smoke (`python -m deploom_mcp`, clean stdout)
        run: python scripts/smoke_stdio.py
      - name: Blueprint CLI smoke (network-free fake core)
        run: python -m deploom_mcp.blueprint --help
      - name: Build sdist and wheel, then smoke outside checkout
        run: |
          python -m pip install build setuptools wheel
          python -m build --no-isolation
          python scripts/smoke_wheel.py
      - name: Skill installer (portable, into runner temp, verified)
        run: |
          python scripts/install_skill.py --client opencode --scope project --project "${{ runner.temp }}/skill-project" --verify
          python scripts/install_skill.py --client codex --scope user --config-home "${{ runner.temp }}/skill-home" --verify
          python scripts/install_skill.py --client opencode --scope project --project "${{ runner.temp }}/skill-project" --dry-run
