name: d1-pilot-no-agent-preflight

on:
  pull_request:
    paths:
      - 'scripts/d1_pilot.py'
      - 'scripts/d1_mcp_value_preflight.py'
      - 'scripts/d1_yellow_policy_demo.py'
      - 'scripts/d1_yellow_windows_demo.ps1'
      - 'docs/D1_WINDOWS_POWERSHELL_DEMO.md'
      - 'tests/test_d1_yellow_policy_demo.py'
      - 'tests/test_d1_pilot.py'
      - 'tests/test_required_intent_bridge.py'
      - 'src/deploom_mcp/server.py'
      - 'src/deploom_mcp/decisions.py'
      - 'contracts/upgrade-blueprint.schema.json'
      - 'upstream/deploom'
      - 'release-manifest.json'
      - 'tests/test_exact_version_objective.py'
      - 'docs/DECISION_CONTRACT.md'
      - 'docs/D1_PILOT_HANDOFF.md'
      - '.github/workflows/d1-pilot-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-paid-models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Strict: compare the checked-in inventory, gitlink, schema and Skill
      # against the exact source bytes BEFORE any installed-package build.
      - name: Verify exact checked-in Core+schema+Skill inventory
        run: |
          python scripts/update_release_manifest.py --check
          python -c "import json; d=json.load(open('release-manifest.json')); print(json.dumps({'coreRevision':d['core']['revision'],'coreContentSha256':d['core']['contentSha256'],'schemaSha256':d['schemaSha256'],'generatorSha256':d['core']['files']['dependency_live_roadmap_generator.py'],'contractSha256':d['core']['files']['draft_decision_contract.py']},sort_keys=True))"
      - name: Install actual pinned MCP and build prerequisites
        run: python -m pip install -e . build setuptools wheel
      - name: Targeted V2 exact contract, immutable and negative controls
        run: python -m unittest discover -s tests -p test_exact_version_objective.py -v
      - name: Build exact checked-out wheel
        run: python -m build --no-isolation
      - name: Recreate P2 public frozen input and verify independent oracle
        run: >-
          python scripts/correctness_preflight.py breaking-demo
          --wheel dist/deploom_mcp-0.2.0-py3-none-any.whl
          --snapshot-dir "${{ runner.temp }}/d1-frozen-chalk"
          --report "${{ runner.temp }}/d1-p2-control.json"
      - name: REAL Chalk-specific MCP value gate (zero agent calls)
        run: >-
          python scripts/d1_mcp_value_preflight.py
          --frozen "${{ runner.temp }}/d1-frozen-chalk"
          --wheel dist/deploom_mcp-0.2.0-py3-none-any.whl
          --report "${{ runner.temp }}/d1-mcp-value.json"
          --require-go
      - name: Yellow per-row policy regression (offline, no model)
        run: python -m unittest discover -s tests -p test_d1_yellow_policy_demo.py -v
      - name: Separate Yellow-compliant Chalk 6 runtime oracle (NOT original P2)
        run: >-
          python scripts/d1_yellow_policy_demo.py
          --frozen "${{ runner.temp }}/d1-frozen-chalk"
          --wheel dist/deploom_mcp-0.2.0-py3-none-any.whl
          --receipt "${{ runner.temp }}/d1-mcp-value.json"
          --report "${{ runner.temp }}/d1-yellow-policy.json"
      - name: CLI native event parsing and explicitly fake dry run
        run: |
          python -m unittest discover -s tests -p test_d1_pilot.py -v
          python -m unittest discover -s tests -p test_required_intent_bridge.py -v
          python scripts/d1_pilot.py dry-run --out "${{ runner.temp }}/d1-fake"
          python scripts/d1_pilot.py doctor
      - name: Display GO/NO_GO honestly (CI PASS does NOT imply MCP usefulness)
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads((Path(os.environ['RUNNER_TEMP'])/'d1-mcp-value.json').read_text())
          text=f"D1 PRODUCT VALUE: {data['gate']}; gap: {data.get('productGap')}\n"
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
              out.write(text)
          PY
      - name: Public launch packet, frozen input and sanitary receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-no-agent-launch-packet
          path: |
            ${{ runner.temp }}/d1-p2-control.json
            ${{ runner.temp }}/d1-mcp-value.json
            ${{ runner.temp }}/d1-yellow-policy.json
            ${{ runner.temp }}/d1-fake/
            ${{ runner.temp }}/d1-frozen-chalk/
            scripts/d1_pilot.py
            scripts/d1_mcp_value_preflight.py
            scripts/d1_yellow_policy_demo.py
            release-manifest.json
            docs/DECISION_CONTRACT.md
            docs/D1_PILOT_HANDOFF.md
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  windows-powershell-51-demo:
    name: Full Yellow/P2/installed-wheel stdio/real runtime (Windows PS 5.1)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full no-agent Windows PowerShell 5.1 demo
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\d1_yellow_windows_demo.ps1 -ExpectedMcpSha '${{ github.event.pull_request.head.sha || github.sha }}' -OutputDir (Join-Path $env:RUNNER_TEMP 'deploom-d1-windows')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Public-only Windows evidence and frozen input
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-yellow-windows-ps51-evidence
          path: |
            ${{ runner.temp }}/deploom-d1-windows/d1-p2-control.json
            ${{ runner.temp }}/deploom-d1-windows/d1-mcp-value.json
            ${{ runner.temp }}/deploom-d1-windows/d1-yellow-policy.json
            ${{ runner.temp }}/deploom-d1-windows/d1-windows-demo-summary.json
            ${{ runner.temp }}/deploom-d1-windows/d1-frozen-chalk/
            ${{ runner.temp }}/deploom-d1-windows/p2-native-windows-seed/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
